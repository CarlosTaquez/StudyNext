<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Iniciar sesión | StudyNext</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: #17233b;
        background: #f4f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(ellipse at 15% 15%, #d9f4f0 0, transparent 36%),
          radial-gradient(ellipse at 90% 85%, #e2e9ff 0, transparent 34%),
          #f4f7fb;
      }

      .page { width: min(100%, 440px); }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        margin-bottom: 27px;
        color: #182944;
        font-size: 23px;
        font-weight: 750;
        letter-spacing: -0.7px;
      }

      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 14px;
        color: white;
        background: #397dce;
        box-shadow: 0 7px 16px #397dce3b;
      }

      .brand-mark svg { width: 23px; height: 23px; }

      .card {
        padding: 38px;
        border: 1px solid #e8edf4;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 20px 55px #243c5c12;
      }

      .eyebrow {
        margin: 0 0 9px;
        color: #397dce;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #17233b;
        font-size: clamp(27px, 6vw, 32px);
        letter-spacing: -1px;
      }

      .intro {
        margin: 10px 0 28px;
        color: #718096;
        font-size: 15px;
        line-height: 1.6;
      }

      .field { margin-bottom: 19px; }

      label {
        display: block;
        margin-bottom: 8px;
        color: #34445e;
        font-size: 13px;
        font-weight: 650;
      }

      input {
        width: 100%;
        height: 49px;
        padding: 0 14px;
        border: 1px solid #dce4ee;
        border-radius: 10px;
        outline: none;
        color: #17233b;
        background: #fff;
        font: inherit;
        font-size: 14px;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      input::placeholder { color: #a3afbf; }
      input:focus {
        border-color: #397dce;
        box-shadow: 0 0 0 3px #397dce1c;
      }

      .form-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 2px 0 24px;
        font-size: 13px;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #65748b;
      }

      .remember input {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: #397dce;
      }

      a { color: #397dce; text-decoration: none; font-weight: 650; }
      a:hover { text-decoration: underline; }

      .submit {
        width: 100%;
        height: 50px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #397dce;
        box-shadow: 0 8px 18px #397dce35;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 150ms ease, transform 150ms ease;
      }

      .submit:hover { background: #2e6db8; transform: translateY(-1px); }

      .signup {
        margin: 24px 0 0;
        color: #718096;
        font-size: 14px;
        text-align: center;
      }

      footer {
        margin-top: 22px;
        color: #8491a4;
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 460px) {
        body { padding: 24px 16px; }
        .card { padding: 29px 23px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="brand" aria-label="StudyNext">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 7.5 12 4l8 3.5-8 3.5-8-3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M7 9.2v5.1c2.8 2.3 7.2 2.3 10 0V9.2M20 8v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span>StudyNext</span>
      </div>

      <section class="card" aria-labelledby="login-title">
        <p class="eyebrow">Tu espacio de aprendizaje</p>
        <h1 id="login-title">¡Qué bueno verte!</h1>
        <p class="intro">Inicia sesión para continuar con tus estudios.</p>

        <form>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" placeholder="tu@correo.com" autocomplete="email" />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="Escribe tu contraseña" autocomplete="current-password" />
          </div>

          <div class="form-row">
            <label class="remember" for="remember">
              <input id="remember" name="remember" type="checkbox" />
              <span>Recordarme</span>
            </label>
            <a href="#recuperar">¿Olvidaste tu contraseña?</a>
          </div>

          <button class="submit" type="button">Iniciar sesión</button>
        </form>

        <p class="signup">¿Aún no tienes una cuenta? <a href="registro.html">Regístrate</a></p>
      </section>

      <footer>StudyNext · Aprende a tu ritmo</footer>
    </main>
  </body>
</html>
