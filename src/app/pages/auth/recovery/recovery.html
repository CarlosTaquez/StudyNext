<main class="page">
  <div class="brand" aria-label="StudyNext">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 7.5 12 4l8 3.5-8 3.5-8-3.5Z" />
        <path d="M7 9.2v5.1c2.8 2.3 7.2 2.3 10 0V9.2M20 8v6" />
      </svg>
    </span>
    <span>StudyNext</span>
  </div>

  <section class="card" aria-labelledby="recovery-title">
    <a class="back-link" routerLink="/login">← Volver al inicio de sesión</a>
    <div class="mail-icon" aria-hidden="true">✉</div>
    <p class="eyebrow">Recupera tu acceso</p>
    <h1 id="recovery-title">¿Olvidaste tu contraseña?</h1>
    <p class="intro">Escribe el correo asociado a tu cuenta y te enviaremos instrucciones para restablecerla.</p>

    <form>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" placeholder="tu@correo.com" autocomplete="email" />
      </div>
      <button class="submit" type="button">Enviar instrucciones</button>
    </form>
  </section>

  <footer>StudyNext · Aprende a tu ritmo</footer>
</main>
