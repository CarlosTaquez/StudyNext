<main class="page">
  <div class="brand" aria-label="StudyNext">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 7.5 12 4l8 3.5-8 3.5-8-3.5Z" />
        <path d="M7 9.2v5.1c2.8 2.3 7.2 2.3 10 0V9.2M20 8v6" />
      </svg>
    </span>
    <span>StudyNext</span>
  </div>

  <section class="card" aria-labelledby="register-title">
    <p class="eyebrow">Empieza hoy</p>
    <h1 id="register-title">Crea tu cuenta</h1>
    <p class="intro">Regístrate para organizar y continuar tu aprendizaje.</p>

    <form (submit)="register($event)">
      <div class="field">
        <label for="name">Nombre completo</label>
        <input id="name" name="name" type="text" placeholder="Tu nombre" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" placeholder="tu@correo.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-control">
          <input id="password" name="password" [type]="passwordVisible ? 'text' : 'password'" placeholder="Crea una contraseña" autocomplete="new-password" minlength="8" required />
          <button class="visibility-toggle" type="button" (click)="passwordVisible = !passwordVisible" [attr.aria-pressed]="passwordVisible" [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'">{{ passwordVisible ? 'Ocultar' : 'Mostrar' }}</button>
        </div>
      </div>
      <div class="field">
        <label for="confirm-password">Confirmar contraseña</label>
        <div class="password-control">
          <input id="confirm-password" name="confirm-password" [type]="confirmPasswordVisible ? 'text' : 'password'" placeholder="Escribe de nuevo tu contraseña" autocomplete="new-password" minlength="8" required />
          <button class="visibility-toggle" type="button" (click)="confirmPasswordVisible = !confirmPasswordVisible" [attr.aria-pressed]="confirmPasswordVisible" [attr.aria-label]="confirmPasswordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'">{{ confirmPasswordVisible ? 'Ocultar' : 'Mostrar' }}</button>
        </div>
      </div>

      <label class="terms" for="terms">
        <input id="terms" name="terms" type="checkbox" required />
        <span>Acepto los términos de uso y la política de privacidad.</span>
      </label>

      <button class="submit" type="submit">Crear cuenta</button>
      <p class="form-message" [class.success]="registrationComplete" role="status" aria-live="polite">{{ message }}</p>
    </form>

    <p class="signin">¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </section>

  <footer>StudyNext · Aprende a tu ritmo</footer>
</main>
