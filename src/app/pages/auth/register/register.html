<main class="page">
  <div class="brand" aria-label="StudyNext">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 7.5 12 4l8 3.5-8 3.5-8-3.5Z" />
        <path d="M7 9.2v5.1c2.8 2.3 7.2 2.3 10 0V9.2M20 8v6" />
      </svg>
    </span>
    <span>StudyNext</span>
  </div>

  <section class="card" aria-labelledby="register-title">
    <p class="eyebrow">Empieza hoy</p>
    <h1 id="register-title">Crea tu cuenta</h1>
    <p class="intro">Regístrate para organizar y continuar tu aprendizaje.</p>

    <form>
      <div class="field">
        <label for="name">Nombre completo</label>
        <input id="name" name="name" type="text" placeholder="Tu nombre" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" placeholder="tu@correo.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" placeholder="Crea una contraseña" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirm-password">Confirmar contraseña</label>
        <input id="confirm-password" name="confirm-password" type="password" placeholder="Escribe de nuevo tu contraseña" autocomplete="new-password" />
      </div>

      <label class="terms" for="terms">
        <input id="terms" name="terms" type="checkbox" />
        <span>Acepto los términos de uso y la política de privacidad.</span>
      </label>

      <button class="submit" type="button">Crear cuenta</button>
    </form>

    <p class="signin">¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </section>

  <footer>StudyNext · Aprende a tu ritmo</footer>
</main>
